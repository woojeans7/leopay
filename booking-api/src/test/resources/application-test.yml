spring:
  datasource:
    url: jdbc:mysql://leopay-mysql.orb.local:3306/leopay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: leopay
    password: 1234
    hikari:
      maximum-pool-size: 300
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
pg:
  base-url: http://localhost:8081
app:
  load-level: normal
