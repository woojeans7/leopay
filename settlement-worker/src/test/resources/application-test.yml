spring:
  datasource:
    url: jdbc:mysql://localhost:3306/leopay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: leopay
    password: 1234
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: localhost:9092
  batch:
    job:
      enabled: false
  main:
    # @TestConfiguration 이 운영 Bean 을 override 할 수 있도록 허용
    # ConsumerFailureWithoutDltTest.FastErrorHandlerConfig 가 KafkaConsumerConfig 의
    # settlementListenerContainerFactory 를 덮어쓰기 위해 필요
    allow-bean-definition-overriding: true
